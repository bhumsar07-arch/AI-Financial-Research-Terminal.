services:
  # 1. Express API Gateway (Node.js)
  - type: web
    name: financial-terminal-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: RAG_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. Python RAG Microservice (FastAPI + SentenceTransformers)
  - type: web
    name: financial-terminal-rag
    env: python
    rootDir: rag-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
